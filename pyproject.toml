[project]
name = "jarvis"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
  "pvporcupine>=3.0.5",
  "pvrecorder>=1.2.4",
  "vosk>=0.3.45",
  "sounddevice>=0.5.1",
  "numpy>=1.24",
  "webrtcvad>=2.0.10",
  "soundfile>=0.12.1",
  "ollama>=0.4.7",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "Pillow>=10.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "duckduckgo-search>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
