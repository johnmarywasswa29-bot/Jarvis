[project]
name = "jarvis"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
  "vosk>=0.3.45",
  "sounddevice>=0.5.1",
  "numpy>=1.24,<2.0",
  "webrtcvad-wheels>=2.0.10; sys_platform == 'win32'",
  "webrtcvad>=2.0.10; sys_platform != 'win32'",
  "soundfile>=0.12.1",
  "ollama>=0.4.7",
  "chromadb>=0.5,<0.5.5",
  "onnxruntime>=1.14.1,<1.21",
  "scipy>=1.11,<2.0",
  "sentence-transformers>=3.0,<4.0",
  "transformers>=4.41,<5.0",
  "torch>=2.2,<2.6",
  "Pillow>=10.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "ddgs>=6.0",
  "psutil>=5.9",
  "openwakeword>=0.6.0",
  "pyttsx3>=2.90",
  "openai>=1.52.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
test = ["pytest>=8.0", "pytest-timeout>=2.3"]
desktop = ["PySide6-Essentials>=6.6,<6.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
