# Jarvis configuration

keyword_path: "assets/jarvis.ppn"
sensitivities: [0.6]

# openWakeWord
openwakeword_model: "hey_jarvis"
openwakeword_threshold: 0.5
openwakeword_inference: "onnx"  # "onnx" or "tflite" (Windows: onnx only)

frame_ms: 30
threshold: 0.01

stt_model_name: "small"
stt_backend: "vosk"

llm_provider: "ollama"
llm_model: "llama3:latest"
llm_base_url: "http://localhost:11434"
llm_fallback_model: "llama2"
llm_timeout_s: 12.0

# NVIDIA Nemotron
nvidia_api_key: ""
nvidia_base_url: "https://integrate.api.nvidia.com/v1"
nvidia_model: "nvidia/nemotron-3-ultra-550b-a55b"
nvidia_temperature: 1.0
nvidia_top_p: 0.95
nvidia_max_tokens: 16384
nvidia_reasoning_budget: 16384
nvidia_enable_thinking: true

tts_engine: "pyttsx3"
tts_rate: 170
tts_volume: 0.9

vision_mode: "gpt-4v"

memory_persist_directory: "memory"
memory_collection: "jarvis_memory"

web_search_enabled: true
desktop_control_enabled: true
code_execution_enabled: true
filesystem_enabled: true
vision_enabled: true
